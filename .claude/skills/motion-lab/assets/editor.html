<title>Motion Lab</title>
<style>
  :root {
    --ink: #f3f6fb;
    --panel: #ffffff;
    --panel-edge: #d7deea;
    --grid-line: #c7d0e0;
    --accent: #c2650a;
    --accent-ink: #ffffff;
    --accent-2: #0f9488;
    --text: #171b26;
    --text-muted: #5b6478;
    --danger: #b3261e;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
    --radius-panel: 14px;
    --radius-control: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #12161f;
      --panel: #1a2030;
      --panel-edge: #2a3244;
      --grid-line: #323c52;
      --accent: #ffb545;
      --accent-ink: #1a1204;
      --accent-2: #5ec8c0;
      --text: #e8ecf4;
      --text-muted: #8892a6;
      --danger: #ff8a80;
    }
  }

  :root[data-theme="dark"] {
    --ink: #12161f;
    --panel: #1a2030;
    --panel-edge: #2a3244;
    --grid-line: #323c52;
    --accent: #ffb545;
    --accent-ink: #1a1204;
    --accent-2: #5ec8c0;
    --text: #e8ecf4;
    --text-muted: #8892a6;
    --danger: #ff8a80;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    margin: 0;
  }

  button, input {
    font-family: inherit;
    color: inherit;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  h1, h2, h3 {
    text-wrap: balance;
    margin: 0;
  }

  .console {
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .rack {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--panel-edge);
    padding-bottom: 16px;
  }

  .wordmark-mark {
    font-family: var(--mono);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 0.14em;
  }

  .wordmark-sub {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }

  .channel {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius-control);
    padding: 8px 14px;
  }

  .channel-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text-muted);
  }

  .channel-value {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
  }

  .bay {
    display: grid;
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
    gap: 20px;
  }

  /* Grid items default to min-width:auto, so a fixed-size <canvas> (its
     640x440 buffer counts as intrinsic content size) can force its track
     wider than the viewport. min-width:0 lets width:100% actually win. */
  .bay > * {
    min-width: 0;
  }

  @media (max-width: 760px) {
    .bay { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius-panel);
    padding: 18px;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .panel-head h2 {
    font-family: var(--mono);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .panel-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
  }

  .scope canvas {
    width: 100%;
    height: auto;
    display: block;
    border-radius: var(--radius-control);
    background: var(--ink);
  }

  .bank-grid {
    display: grid;
    grid-template-columns: 84px repeat(4, 1fr);
    gap: 4px;
  }

  .bank-corner {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
  }

  .bank-col-label {
    font-family: var(--mono);
    font-size: 10px;
    text-align: center;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    padding-bottom: 4px;
  }

  .bank-row-label {
    font-family: var(--mono);
    font-size: 11px;
    display: flex;
    align-items: center;
    padding-right: 6px;
    color: var(--text-muted);
  }

  .preset-cell {
    appearance: none;
    border: 1px solid var(--panel-edge);
    background: var(--ink);
    border-radius: var(--radius-control);
    padding: 7px 2px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
  }

  @media (prefers-reduced-motion: reduce) {
    .preset-cell { transition: none; }
  }

  .preset-cell:hover {
    border-color: var(--accent);
    color: var(--text);
  }

  .preset-cell[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
  }

  .reserved {
    min-height: 120px;
    border: 1px dashed var(--panel-edge);
    border-radius: var(--radius-panel);
  }

  .readout-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .readout-value {
    flex: 1;
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.01em;
    background: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius-control);
    padding: 10px 14px;
    overflow-x: auto;
    white-space: nowrap;
  }

  .readout-copy {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--radius-control);
    padding: 10px 18px;
    font-weight: 600;
    font-family: var(--mono);
    cursor: pointer;
    white-space: nowrap;
  }

  .readout-copy[data-copied="true"] {
    background: var(--accent-2);
  }

  .track {
    position: relative;
    height: 44px;
    margin: 6px 24px 18px;
    border-bottom: 1px solid var(--panel-edge);
  }

  .track canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .ball {
    position: absolute;
    top: 50%;
    width: 16px;
    height: 16px;
    margin-top: -8px;
    margin-left: -8px;
    border-radius: 50%;
    background: var(--accent);
  }

  .standin-row {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    padding: 0 12px;
  }

  .standin {
    padding: 12px 22px;
    border-radius: var(--radius-control);
    border: 1px solid var(--panel-edge);
    background: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 600;
  }

  .standin-track {
    width: 100%;
    height: 14px;
    border-radius: 999px;
    background: var(--ink);
    border: 1px solid var(--panel-edge);
    overflow: hidden;
  }

  .standin-fill {
    height: 100%;
    background: var(--accent-2);
  }

  .control-row {
    display: grid;
    grid-template-columns: 82px 1fr 120px;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .control-row label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  .control-row input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
  }

  .control-row input[type="number"] {
    width: 100%;
    background: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: var(--radius-control);
    padding: 5px 8px;
  }

  .control-readout {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-muted);
    justify-self: end;
    text-align: right;
  }

  .control-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .control-actions button {
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--radius-control);
    padding: 8px 16px;
    font-weight: 600;
    font-family: var(--mono);
    cursor: pointer;
  }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: none;
    letter-spacing: 0;
  }
</style>

<div class="console">
  <header class="rack">
    <div>
      <span class="wordmark-mark">MOTION LAB</span>
      <span class="wordmark-sub">Godot Tween console</span>
    </div>
    <div class="channel">
      <span class="channel-label">Channel</span>
      <span id="target-label" class="channel-value"></span>
    </div>
  </header>

  <main class="bay">
    <section id="graph" class="panel scope" aria-label="Easing curve">
      <div class="panel-head">
        <h2>Curve</h2>
        <span class="panel-meta" id="curve-meta"></span>
      </div>
      <canvas id="curve" width="640" height="440"></canvas>
    </section>

    <section id="presets" class="panel bank" aria-label="Transition and ease presets">
      <div class="panel-head">
        <h2>Shape bank</h2>
        <span class="panel-meta">12 &times; 4</span>
      </div>
      <div class="bank-grid" id="bank-grid" role="group" aria-label="Preset grid"></div>
    </section>

    <section id="stage" class="panel" aria-label="Live preview">
      <div class="panel-head">
        <h2>Preview</h2>
        <span class="panel-meta" id="stage-meta"></span>
      </div>
      <div class="track" id="track">
        <canvas id="ghosts" width="600" height="44"></canvas>
        <div class="ball" id="ball"></div>
      </div>
      <div class="standin-row">
        <div class="standin" id="standin"></div>
        <div class="standin-track" id="standin-track" hidden>
          <div class="standin-fill" id="standin-fill"></div>
        </div>
      </div>
    </section>

    <section id="controls" class="panel controls" aria-label="Tuning controls">
      <div class="panel-head"><h2>Controls</h2></div>

      <div class="control-row">
        <label for="intensity">Intensity</label>
        <input type="range" id="intensity" min="0" max="6" step="1">
        <span class="control-readout" id="intensity-readout"></span>
      </div>

      <div class="control-row">
        <label for="duration">Duration</label>
        <input type="range" id="duration" min="0.02" max="2" step="0.01" list="duration-ticks">
        <span class="control-readout" id="duration-readout"></span>
      </div>
      <datalist id="duration-ticks">
        <option value="0.08"></option>
        <option value="0.18"></option>
        <option value="0.32"></option>
        <option value="0.55"></option>
      </datalist>

      <div class="control-row">
        <label for="travel">Travel</label>
        <input type="number" id="travel" step="0.01">
        <span class="control-readout" id="travel-readout">start value</span>
      </div>

      <div class="control-row">
        <label>Playback</label>
        <div class="control-actions">
          <button type="button" id="replay">Replay</button>
          <label class="checkbox"><input type="checkbox" id="loop" checked> Loop</label>
        </div>
        <span></span>
      </div>
    </section>

    <section id="token" class="panel" aria-label="Token">
      <div class="panel-head">
        <h2>Token</h2>
        <span class="panel-meta">paste back into chat</span>
      </div>
      <div class="readout-row">
        <code class="readout-value" id="token-value"></code>
        <button type="button" class="readout-copy" id="token-copy">Copy</button>
      </div>
    </section>
  </main>
</div>

<script>
const EASING = /*__GODOT_EASING_TABLE__*/ null;
const TARGET = /*__MOTION_LAB_TARGET__*/ {
  element: "Lanjut", scene: "EndCutscene.tscn", property: "scale",
  trans: "BACK", ease: "OUT", duration: 0.32, travel: 0.90
};

const TRANSITIONS = ["LINEAR", "SINE", "QUINT", "QUART", "QUAD", "EXPO",
  "ELASTIC", "CUBIC", "CIRC", "BOUNCE", "BACK", "SPRING"];
const EASES = ["IN", "OUT", "IN_OUT", "OUT_IN"];

// design_tokens.tres, Motion group. test_motion_lab.gd asserts these match.
const TOKENS = { instant: 0.08, fast: 0.18, normal: 0.32, slow: 0.55 };

const STATE = {
  trans: TARGET.trans, ease: TARGET.ease,
  duration: TARGET.duration, travel: TARGET.travel,
  property: TARGET.property, intensity: 3, loop: true
};

// Linear interpolation between the 256 samples Godot gave us. Returns the
// engine's own number, so the preview cannot drift from the game.
function sampleCurve(trans, ease, p) {
  const curve = EASING.curves[trans + "/" + ease];
  const n = curve.length;
  const x = Math.min(1, Math.max(0, p)) * (n - 1);
  const i = Math.floor(x);
  if (i >= n - 1) return curve[n - 1];
  return curve[i] + (curve[i + 1] - curve[i]) * (x - i);
}

// One slider, two meanings. On the ladder families each step is a strictly
// steeper curve -- the bezier-handle sensation, but every stop is a real
// Godot preset. The fixed-shape families cannot change shape at all
// (Godot exposes no overshoot constant on Tween), so intensity moves how
// far the property travels instead.
const LADDER = ["LINEAR", "SINE", "QUAD", "CUBIC", "QUART", "QUINT", "EXPO"];
const FIXED_SHAPE = ["BACK", "ELASTIC", "BOUNCE", "SPRING", "CIRC"];

// Per-property travel range: where the property STARTS (it always ends at
// rest). "barely moves" at intensity 0 up to "throws itself" at intensity 6.
const TRAVEL_RANGE = {
  scale: [0.98, 0.70],
  fade: [0.90, 0.00],
  slide: [20, 400],
  fill: [0.90, 0.00]
};

function travelForIntensity(i) {
  const [lo, hi] = TRAVEL_RANGE[STATE.property];
  return lo + (hi - lo) * (i / 6);
}

function applyIntensity(i) {
  STATE.intensity = Math.min(6, Math.max(0, i | 0));
  if (LADDER.includes(STATE.trans)) {
    STATE.trans = LADDER[STATE.intensity];
  } else {
    STATE.travel = travelForIntensity(STATE.intensity);
  }
  render();
}

// Selecting a grid cell in a ladder family sets intensity to that
// transition's rung, so the slider and the grid never disagree.
function selectPreset(trans, ease) {
  STATE.trans = trans;
  STATE.ease = ease;
  if (LADDER.includes(trans)) {
    STATE.intensity = LADDER.indexOf(trans);
  } else {
    const [lo, hi] = TRAVEL_RANGE[STATE.property];
    STATE.intensity = Math.min(6, Math.max(0,
      Math.round(((STATE.travel - lo) / (hi - lo)) * 6)));
  }
  render();
}

function nearestToken(value) {
  let best = null;
  let bestDist = Infinity;
  for (const name in TOKENS) {
    const d = Math.abs(TOKENS[name] - value);
    if (d < bestDist) { bestDist = d; best = name; }
  }
  return bestDist <= 0.015 ? best : null;
}

function intensityDescription() {
  if (LADDER.includes(STATE.trans)) {
    return "steepening the curve - " + STATE.trans;
  }
  const expected = travelForIntensity(STATE.intensity);
  if (Math.abs(expected - STATE.travel) > 0.001) {
    return "custom travel - shape is fixed for " + STATE.trans;
  }
  return "travel " + STATE.travel.toFixed(2) + " - shape is fixed for " + STATE.trans;
}

function renderControls() {
  const intensity = document.getElementById("intensity");
  intensity.value = STATE.intensity;
  document.getElementById("intensity-readout").textContent = intensityDescription();

  const duration = document.getElementById("duration");
  duration.value = STATE.duration;
  const token = nearestToken(STATE.duration);
  document.getElementById("duration-readout").textContent = token
    ? STATE.duration.toFixed(3) + "s (dur_" + token + ")"
    : STATE.duration.toFixed(3) + "s";

  document.getElementById("travel").value = STATE.travel.toFixed(2);
  document.getElementById("loop").checked = STATE.loop;
}

function wireControls() {
  document.getElementById("intensity").addEventListener("input", (e) => {
    applyIntensity(parseInt(e.target.value, 10));
  });
  document.getElementById("duration").addEventListener("input", (e) => {
    let value = parseFloat(e.target.value);
    const token = nearestToken(value);
    if (token) value = TOKENS[token];
    STATE.duration = value;
    render();
  });
  document.getElementById("travel").addEventListener("input", (e) => {
    STATE.travel = parseFloat(e.target.value);
    render();
  });
  document.getElementById("loop").addEventListener("change", (e) => {
    STATE.loop = e.target.checked;
  });
  document.getElementById("replay").addEventListener("click", () => {
    started = performance.now();
  });
}

// The stand-in mock shown depends on which property is being tuned: a
// button-shaped card for scale/fade/slide, a progress bar for fill.
function renderStandIn() {
  const standin = document.getElementById("standin");
  const track = document.getElementById("standin-track");
  standin.hidden = STATE.property === "fill";
  track.hidden = STATE.property !== "fill";
  standin.textContent = TARGET.element;
  document.getElementById("stage-meta").textContent =
    "property: " + STATE.property;
}

function applyStandIn(v) {
  const standin = document.getElementById("standin");
  switch (STATE.property) {
    case "scale": {
      const s = STATE.travel + (1 - STATE.travel) * v;
      standin.style.transform = "scale(" + s + ")";
      break;
    }
    case "fade": {
      standin.style.opacity = STATE.travel + (1 - STATE.travel) * v;
      break;
    }
    case "slide": {
      const x = STATE.travel * (1 - v);
      standin.style.transform = "translateX(" + x + "px)";
      break;
    }
    case "fill": {
      const pct = (STATE.travel + (1 - STATE.travel) * v) * 100;
      document.getElementById("standin-fill").style.width = pct + "%";
      break;
    }
  }
}

function drawGhosts() {
  const canvas = document.getElementById("ghosts");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const style = getComputedStyle(document.documentElement);
  ctx.clearRect(0, 0, W, H);
  ctx.strokeStyle = style.getPropertyValue("--panel-edge").trim();
  ctx.beginPath();
  ctx.moveTo(0, H / 2);
  ctx.lineTo(W, H / 2);
  ctx.stroke();
  ctx.fillStyle = style.getPropertyValue("--text-muted").trim();
  // Eight samples at even TIME intervals -- where they bunch up is where
  // the animation lingers, the fastest way to read a curve's shape by eye.
  for (let i = 0; i <= 7; i++) {
    const t = i / 7;
    const v = sampleCurve(STATE.trans, STATE.ease, t);
    const x = Math.min(1, Math.max(0, v)) * W;
    ctx.globalAlpha = 0.25 + 0.5 * (i / 7);
    ctx.beginPath();
    ctx.arc(x, H / 2, 3, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function buildToken() {
  return [
    "KJT-MOTION v1",
    STATE.trans + "/" + STATE.ease,
    STATE.duration.toFixed(3) + "s",
    "travel " + STATE.travel.toFixed(2),
    STATE.property,
    TARGET.element + "@" + TARGET.scene
  ].join(" | ");
}

function renderToken() {
  document.getElementById("token-value").textContent = buildToken();
}

function wireToken() {
  const copyBtn = document.getElementById("token-copy");
  copyBtn.addEventListener("click", async () => {
    // navigator.clipboard.writeText() throws NotAllowedError when the
    // document lacks focus (e.g. right after the page opens) -- fall back
    // to selecting the readout so the user still has a path: Ctrl+C.
    let copied = true;
    try {
      await navigator.clipboard.writeText(buildToken());
    } catch (err) {
      copied = false;
      const range = document.createRange();
      range.selectNodeContents(document.getElementById("token-value"));
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
    copyBtn.textContent = copied ? "Copied" : "Press Ctrl+C";
    copyBtn.setAttribute("data-copied", "true");
    setTimeout(() => {
      copyBtn.textContent = "Copy";
      copyBtn.removeAttribute("data-copied");
    }, copied ? 1200 : 2400);
  });
}

let started = performance.now();
const LOOP_GAP = 0.6; // seconds of rest between repeats, while looping

function frame(now) {
  const cycle = STATE.duration + LOOP_GAP;
  let elapsed = (now - started) / 1000;
  if (STATE.loop) {
    elapsed = elapsed % cycle;
  } else if (elapsed > STATE.duration) {
    elapsed = STATE.duration;
  }
  const p = Math.min(1, elapsed / STATE.duration);
  const v = sampleCurve(STATE.trans, STATE.ease, p);

  STATE._playheadT = p;
  drawGraph();

  const track = document.getElementById("track");
  const ball = document.getElementById("ball");
  const x = Math.min(1, Math.max(0, v)) * track.clientWidth;
  ball.style.left = x + "px";
  applyStandIn(v);

  requestAnimationFrame(frame);
}

function renderGrid() {
  const grid = document.getElementById("bank-grid");
  grid.innerHTML = "";

  const corner = document.createElement("div");
  corner.className = "bank-corner";
  grid.appendChild(corner);
  for (const ease of EASES) {
    const label = document.createElement("div");
    label.className = "bank-col-label";
    label.textContent = ease;
    grid.appendChild(label);
  }

  for (const trans of TRANSITIONS) {
    const rowLabel = document.createElement("div");
    rowLabel.className = "bank-row-label";
    rowLabel.textContent = trans;
    grid.appendChild(rowLabel);

    for (const ease of EASES) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "preset-cell";
      btn.textContent = ease;
      const pressed = trans === STATE.trans && ease === STATE.ease;
      btn.setAttribute("aria-pressed", pressed ? "true" : "false");
      btn.addEventListener("click", () => selectPreset(trans, ease));
      grid.appendChild(btn);
    }
  }
}

function drawGraph() {
  const canvas = document.getElementById("curve");
  const ctx = canvas.getContext("2d");
  const W = canvas.width;
  const H = canvas.height;
  const style = getComputedStyle(document.documentElement);
  const gridColor = style.getPropertyValue("--grid-line").trim();
  const textColor = style.getPropertyValue("--text-muted").trim();
  const accentColor = style.getPropertyValue("--accent").trim();

  ctx.clearRect(0, 0, W, H);

  // Value 1.0 sits a quarter of the way down, 0.0 three quarters down --
  // the remaining top/bottom quarters are reserved for BACK/ELASTIC/SPRING
  // overshoot, drawn honestly instead of clipped.
  const mapV = (v) => 0.75 * H - v * 0.5 * H;
  const oneY = mapV(1.0);
  const zeroY = mapV(0.0);

  ctx.fillStyle = gridColor;
  ctx.globalAlpha = 0.25;
  ctx.fillRect(0, 0, W, oneY);
  ctx.fillRect(0, zeroY, W, H - zeroY);
  ctx.globalAlpha = 1;

  ctx.strokeStyle = gridColor;
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const x = (i / 4) * W;
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);
    ctx.stroke();
  }

  ctx.strokeStyle = textColor;
  ctx.beginPath();
  ctx.moveTo(0, oneY);
  ctx.lineTo(W, oneY);
  ctx.moveTo(0, zeroY);
  ctx.lineTo(W, zeroY);
  ctx.stroke();

  ctx.fillStyle = textColor;
  ctx.font = "11px " + style.getPropertyValue("--mono").trim();
  ctx.fillText("1.0", 6, oneY - 6);
  ctx.fillText("0.0", 6, zeroY - 6);

  ctx.strokeStyle = accentColor;
  ctx.lineWidth = 3;
  ctx.beginPath();
  const steps = 256;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const v = sampleCurve(STATE.trans, STATE.ease, t);
    const x = t * W;
    const y = mapV(v);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // Playhead: parked at t=0 until the animation loop lands.
  const playheadT = STATE._playheadT || 0;
  const pv = sampleCurve(STATE.trans, STATE.ease, playheadT);
  ctx.fillStyle = accentColor;
  ctx.beginPath();
  ctx.arc(playheadT * W, mapV(pv), 5, 0, Math.PI * 2);
  ctx.fill();
}

function render() {
  document.getElementById("target-label").textContent =
    TARGET.element + " @ " + TARGET.scene;
  document.getElementById("curve-meta").textContent =
    STATE.trans + "/" + STATE.ease + " - " + STATE.duration.toFixed(2) + "s";
  renderGrid();
  drawGraph();
  renderControls();
  renderStandIn();
  drawGhosts();
  renderToken();
  started = performance.now();
}

// Seed intensity from the resolved target's actual travel/transition rather
// than an arbitrary default, so the slider starts near where the data is.
if (LADDER.includes(STATE.trans)) {
  STATE.intensity = LADDER.indexOf(STATE.trans);
} else {
  const [lo, hi] = TRAVEL_RANGE[STATE.property];
  STATE.intensity = Math.min(6, Math.max(0,
    Math.round(((STATE.travel - lo) / (hi - lo)) * 6)));
}

wireControls();
wireToken();
render();
requestAnimationFrame(frame);
</script>
