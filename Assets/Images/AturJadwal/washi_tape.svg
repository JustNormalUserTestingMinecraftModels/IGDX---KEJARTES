<svg xmlns="http://www.w3.org/2000/svg" width="246" height="40" viewBox="0 0 246 40">
  <!-- Washi tape across the top of a DayStickyNote. Drawn white so the
       node self_modulate tints it to the day category colour; the stripes
       are a lighter grey so they read as a darker shade of that colour.
       Stripes are explicit polygons, not a <pattern>, which ThorVG drops. -->
