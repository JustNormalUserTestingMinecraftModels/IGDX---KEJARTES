  <!-- Photo paperclip (MURIDMU RosterCard Task 1 groundwork), a decorative
       prop pinned at the portrait's top-centre with a ~8deg rotation set on
       its node, not baked in here. Drawn as a double pass over one wire
       path - a wide dark stroke first, a narrower light stroke on top -
       so it reads as a light metal wire with a dark rim, the same
       light-fill/dark-outline language as Assets/Images/UI/Icons/README.md,
       applied to a stroked shape instead of a closed glyph. Not scanned by
       tests/test_ui_icons.gd (that suite is fixed to UI/Icons/), so the
       contrast rule here is a style choice, not a pinned assertion. -->
